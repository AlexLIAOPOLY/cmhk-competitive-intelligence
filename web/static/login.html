<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 · CMHK市场竞争全景</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { min-height:100dvh; margin:0; color:#e9f7fb; background-color:#04131d; background-image:
        linear-gradient(90deg,rgba(2,15,25,.18),rgba(3,19,30,.3) 48%,rgba(2,14,23,.42)),
        linear-gradient(180deg,rgba(2,14,23,.08) 48%,rgba(2,14,23,.28) 100%),
        url("/static/assets/login-hong-kong-network-bg-v1.webp");
        background-size:cover; background-position:center bottom; background-repeat:no-repeat; background-attachment:fixed; }
      body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.2; background-image:linear-gradient(rgba(95,201,224,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(95,201,224,.06) 1px,transparent 1px); background-size:42px 42px; mask-image:linear-gradient(to bottom,black,transparent 72%); }
      .login-page { position:relative; z-index:1; min-height:100dvh; display:grid; grid-template-columns:minmax(0,1.25fr) minmax(400px,520px); align-items:center; gap:clamp(40px,6vw,96px); width:min(1480px,calc(100% - 48px)); margin:auto; padding:48px 0; }
      .brand img { width:148px; height:auto; filter:drop-shadow(0 10px 24px rgba(27,166,202,.18)); }
      .eyebrow { display:block; margin-top:44px; color:#6ed9eb; font:600 12px/1.4 ui-monospace,SFMono-Regular,monospace; letter-spacing:.18em; }
      h1 { max-width:none; margin:12px 0 20px; font-size:clamp(38px,4.4vw,66px); line-height:1.08; letter-spacing:-.04em; white-space:nowrap; }
      .intro { max-width:620px; margin:0; color:#9abac5; font-size:16px; line-height:1.8; }
      .signals { display:flex; flex-wrap:wrap; gap:10px; margin-top:32px; padding:0; list-style:none; }
      .signals li { border:1px solid rgba(103,208,225,.18); border-radius:999px; padding:8px 12px; color:#bcd5dc; background:rgba(6,35,49,.56); font-size:12px; }
      .login-card { position:relative; min-height:610px; display:flex; flex-direction:column; border:1px solid rgba(107,218,232,.23); border-radius:24px; padding:42px 44px 38px; background:rgba(7,31,43,.86); box-shadow:0 28px 80px rgba(0,8,14,.38); backdrop-filter:blur(22px) saturate(130%); }
      .login-card::before { content:""; position:absolute; inset:0 26px auto; height:1px; background:linear-gradient(90deg,transparent,#6ed9eb,transparent); }
      .login-card h2 { margin:0 0 8px; text-align:center; font-size:28px; }
      .login-card > .login-hint { margin:0; color:#9bb8c2; text-align:center; font-size:14px; line-height:1.65; }
      .login-card > .login-hint strong { color:#e9f7fb; font-weight:650; }
      .motion-stage { flex:1; display:grid; place-items:center; padding:30px 0 26px; }
      .login-motion { position:relative; width:240px; aspect-ratio:1; display:grid; place-items:center; }
      .motion-halo { position:absolute; inset:35px; border-radius:50%; background:radial-gradient(circle,rgba(93,221,231,.28),rgba(51,174,199,.08) 52%,transparent 72%); animation:halo-breathe 3.2s ease-in-out infinite; }
      .motion-orbit { position:absolute; border:1px solid rgba(111,222,234,.32); border-radius:50%; }
      .motion-orbit::after { content:""; position:absolute; top:50%; right:-4px; width:8px; height:8px; margin-top:-4px; border-radius:50%; background:#79e4ed; box-shadow:0 0 16px rgba(121,228,237,.9); }
      .motion-orbit.is-one { inset:24px; animation:orbit-spin 8s linear infinite; }
      .motion-orbit.is-two { inset:50px; border-color:rgba(73,203,170,.28); animation:orbit-spin 6s linear infinite reverse; }
      .motion-orbit.is-two::after { background:#55d2ad; box-shadow:0 0 16px rgba(85,210,173,.85); }
      .motion-core { position:relative; z-index:2; width:112px; height:112px; display:grid; place-items:center; border:1px solid rgba(142,233,241,.5); border-radius:32px; color:#dffcff; background:linear-gradient(145deg,rgba(47,154,179,.92),rgba(30,105,130,.96)); box-shadow:0 22px 45px rgba(0,9,15,.35),inset 0 1px 0 rgba(255,255,255,.22); animation:core-float 3.2s ease-in-out infinite; }
      .motion-core svg { width:64px; height:64px; }
      .motion-node { position:absolute; z-index:3; width:9px; height:9px; border:2px solid rgba(224,253,255,.9); border-radius:3px; background:#42c7dc; box-shadow:0 0 14px rgba(66,199,220,.75); animation:node-pulse 2.4s ease-in-out infinite; }
      .motion-node.is-a { top:31px; left:55px; }
      .motion-node.is-b { top:58px; right:28px; animation-delay:-.8s; }
      .motion-node.is-c { right:58px; bottom:27px; animation-delay:-1.6s; }
      .motion-caption { margin:-12px 0 26px; color:#8eaeba; text-align:center; font-size:12px; line-height:1.6; }
      button { width:100%; min-height:46px; border-radius:10px; font:inherit; }
      button { border:1px solid transparent; cursor:pointer; font-weight:650; }
      button:disabled { cursor:not-allowed; opacity:.52; }
      .feishu { color:#03202b; background:linear-gradient(135deg,#76dff0,#49cbaa 88%); box-shadow:0 10px 28px rgba(70,204,205,.2); }
      .feishu:hover:not(:disabled) { filter:brightness(1.06); }
      .feishu:focus-visible { outline:3px solid rgba(119,226,237,.42); outline-offset:3px; }
      .status { min-height:19px; margin:12px 0 0; color:#8db2bd; text-align:center; font-size:12px; line-height:1.55; }
      .status:empty { display:none; }
      .status.is-error { color:#ffad9e; }
      @keyframes orbit-spin { to { transform:rotate(360deg); } }
      @keyframes halo-breathe { 0%,100% { opacity:.62; transform:scale(.94); } 50% { opacity:1; transform:scale(1.08); } }
      @keyframes core-float { 0%,100% { transform:translateY(4px); } 50% { transform:translateY(-6px); } }
      @keyframes node-pulse { 0%,100% { opacity:.45; transform:scale(.75); } 50% { opacity:1; transform:scale(1.15); } }
      @media (max-width:980px) { body { background-position:62% bottom; background-attachment:scroll; } .login-page { grid-template-columns:1fr; width:min(640px,calc(100% - 32px)); gap:42px; padding:36px 0; } .brand img{width:126px}.eyebrow{margin-top:30px} h1{font-size:clamp(28px,8.5vw,48px)}.intro{font-size:14px}.signals{margin-top:22px}.login-card{min-height:520px;padding:32px 26px 28px}.motion-stage{padding:20px 0 16px}.login-motion{width:min(210px,64vw);transform:scale(.9)} }
      @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition:none!important; animation:none!important; } }
    </style>
  </head>
  <body>
    <main class="login-page">
      <section class="brand" aria-labelledby="loginTitle">
        <img src="/static/assets/china-mobile-blue-logo.png?v=2" alt="中國移動 China Mobile" />
        <span class="eyebrow">CMHK COMPETITIVE LANDSCAPE</span>
        <h1 id="loginTitle">CMHK市场竞争全景</h1>
        <p class="intro">统一接入战略竞对看板、情报研判、报告触达、智能工具与运维系统。登录后将按你的岗位权限展示对应工作页签。</p>
        <ul class="signals" aria-label="平台能力"><li>经营驾驶舱</li><li>战略情报生产</li><li>分角色权限</li><li>飞书统一身份</li></ul>
      </section>
      <section class="login-card" aria-labelledby="signInTitle">
        <h2 id="signInTitle">登录工作台</h2>
        <p class="login-hint">使用 <strong>CMHK 飞书账号</strong> 完成身份验证</p>
        <div class="motion-stage" aria-hidden="true">
          <div class="login-motion">
            <span class="motion-halo"></span>
            <span class="motion-orbit is-one"></span>
            <span class="motion-orbit is-two"></span>
            <span class="motion-node is-a"></span>
            <span class="motion-node is-b"></span>
            <span class="motion-node is-c"></span>
            <div class="motion-core">
              <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M32 7 51 15v13c0 13-7.8 23.8-19 29-11.2-5.2-19-16-19-29V15L32 7Z" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/>
                <circle cx="32" cy="27" r="6" stroke="currentColor" stroke-width="3"/>
                <path d="M20 44c2.2-6.7 6.2-10 12-10s9.8 3.3 12 10" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
              </svg>
            </div>
          </div>
        </div>
        <p class="motion-caption">飞书统一身份认证 · 安全接入</p>
        <button class="feishu" id="feishuLogin" type="button" disabled>正在检查飞书登录…</button>
        <p class="status" id="loginStatus" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script>
      (() => {
        "use strict";
        const params = new URLSearchParams(location.search);
        const rawNext = params.get("next") || "/";
        const next = rawNext.startsWith("/") && !rawNext.startsWith("//") ? rawNext : "/";
        const status = document.getElementById("loginStatus");
        const feishuButton = document.getElementById("feishuLogin");
        const errorLabels = {
          authorization_cancelled:"你已取消飞书授权，请重试。",
          invalid_state:"登录请求已过期，请重新发起登录。",
          wrong_tenant:"当前飞书账号不属于获准组织。",
          exchange_failed:"飞书身份验证失败，请稍后重试。",
        };
        const oauthError = params.get("feishu_error");
        if (oauthError) { status.textContent = errorLabels[oauthError] || "飞书登录未完成，请重试。"; status.classList.add("is-error"); }
        const setBusy = (busy, text) => { feishuButton.disabled = busy; if (text) status.textContent = text; };
        const fail = (error) => { status.textContent = error.message || "登录服务暂时不可用。"; status.classList.add("is-error"); setBusy(false); };
        if (params.get("switch") !== "1") {
          fetch("/api/auth/me", { cache:"no-store", credentials:"same-origin" }).then((response) => response.json()).then((payload) => {
            if (payload.authenticated) location.replace(next);
          }).catch(() => {});
        }
        fetch("/api/auth/config", { cache:"no-store", credentials:"same-origin" }).then(async (response) => {
          const payload = await response.json().catch(() => ({}));
          if (!response.ok || payload.ok === false) throw new Error(payload.message || "无法读取登录配置");
          if (payload.feishu?.configured) { feishuButton.disabled = false; feishuButton.textContent = "使用飞书账号登录"; }
          else { feishuButton.textContent = "飞书登录尚未配置"; }
        }).catch(fail);
        feishuButton.addEventListener("click", () => { setBusy(true,"正在前往飞书完成身份验证…"); location.assign(`/api/auth/feishu/start?next=${encodeURIComponent(next)}`); });
      })();
    </script>
  </body>
</html>
