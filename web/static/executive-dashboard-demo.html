<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>中国移动｜战略监控体系</title>
  <link rel="stylesheet" href="/static/executive-dashboard-demo.css?v=36">
  <link rel="stylesheet" href="/static/executive-responsive-hardening.css?v=7">
</head>
<body>
  <main class="cockpit">
    <header class="topbar">
      <a class="brand" href="/" aria-label="返回主页" title="返回主页">
        <img src="/static/assets/china-mobile-blue-logo.png" alt="中国移动 China Mobile">
      </a>
      <div class="cockpit-title"><h1>战略监控体系</h1><span>STRATEGIC MONITORING SYSTEM · 中国移动集团公开数据</span></div>
    </header>

    <section class="dashboard-grid" aria-label="中国移动战略监控四层体系">
      <article class="panel panel-network">
        <img class="scene scene-network" src="/static/assets/executive-dashboard/strategy-command-grid-v2.webp" alt="" aria-hidden="true">
        <div class="panel-glass"></div>
        <header class="panel-heading">
          <span>01</span><h2>资源与基础设施层</h2>
        </header>
        <div class="monitor-content network-monitor" id="network-detail">
          <div class="visual-stage" data-network-visual></div>
          <div class="kpi-grid" data-network-metrics></div>
        </div>
      </article>

      <article class="panel panel-business">
        <img class="scene scene-business" src="/static/assets/executive-dashboard/strategy-command-grid-v2.webp" alt="" aria-hidden="true">
        <div class="panel-glass"></div>
        <header class="panel-heading">
          <span>02</span><h2>客户与业务对标层</h2>
        </header>
        <div class="monitor-content business-content" id="business-detail">
          <div class="business-cards" data-business-cards></div>
        </div>
      </article>

      <article class="panel panel-reach">
        <img class="scene scene-reach" src="/static/assets/executive-dashboard/strategy-command-grid-v2.webp" alt="" aria-hidden="true">
        <div class="panel-glass"></div>
        <header class="panel-heading">
          <span>03</span><h2>政企与国际触达层</h2>
        </header>
        <div class="monitor-content reach-content" id="reach-detail"><div data-reach-content></div></div>
      </article>

      <article class="panel panel-finance">
        <img class="scene scene-finance" src="/static/assets/executive-dashboard/strategy-command-grid-v2.webp" alt="" aria-hidden="true">
        <div class="panel-glass"></div>
        <header class="panel-heading">
          <span>04</span><h2>财务成果</h2>
        </header>
        <div class="monitor-content finance-content" id="finance-detail"><div data-finance-content></div></div>
      </article>
    </section>

  </main>
  <script src="/static/executive-dashboard-demo.js?v=19"></script>
</body>
</html>
