<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>中国移动香港｜战略监控体系</title>
  <link rel="stylesheet" href="/static/executive-dashboard-demo.css?v=41">
  <link rel="stylesheet" href="/static/executive-responsive-hardening.css?v=12">
</head>
<body>
  <div class="app">
    <header class="masthead">
      <a class="brand" href="/" aria-label="返回主页面" title="返回主页面">
        <img src="/static/assets/china-mobile-blue-logo.png" alt="中国移动 China Mobile">
      </a>

      <div class="masthead-title">
        <h1>战略监控体系</h1>
        <p>STRATEGIC MONITORING SYSTEM</p>
      </div>

      <div class="masthead-meta">
        <span class="live"><i aria-hidden="true"></i>数据同步中</span>
        <time data-clock datetime=""></time>
      </div>
    </header>

    <main class="board" aria-label="CMHK 战略监控四层体系">
      <section class="panel panel-network" aria-labelledby="panel-01-title">
        <header class="panel-head">
          <span class="panel-index">01</span>
          <h2 id="panel-01-title">资源与基础设施层</h2>
          <span class="panel-tag">网络与算力资源</span>
        </header>
        <div class="panel-body">
          <div class="network-stage" data-network-visual></div>
          <div class="network-metrics" data-network-metrics></div>
        </div>
      </section>

      <section class="panel panel-business" aria-labelledby="panel-02-title">
        <header class="panel-head">
          <span class="panel-index">02</span>
          <h2 id="panel-02-title">客户与业务对标层</h2>
          <span class="panel-tag">三大业务板块</span>
        </header>
        <div class="panel-body">
          <div class="business-grid" data-business-cards></div>
        </div>
      </section>

      <section class="panel panel-reach" aria-labelledby="panel-03-title">
        <header class="panel-head">
          <span class="panel-index">03</span>
          <h2 id="panel-03-title">渠道与品牌触达层</h2>
          <span class="panel-tag">线下与线上触点</span>
        </header>
        <div class="panel-body">
          <div class="reach-grid" data-reach-content></div>
        </div>
      </section>

      <section class="panel panel-finance" aria-labelledby="panel-04-title">
        <header class="panel-head">
          <span class="panel-index">04</span>
          <h2 id="panel-04-title">财务成果</h2>
          <span class="panel-tag">经营质量</span>
        </header>
        <div class="panel-body">
          <div class="finance-grid" data-finance-content></div>
        </div>
      </section>
    </main>

    <footer class="footnote">
      <span>监控链路　资源 → 业务 → 渠道 → 财务</span>
      <span>数值口径以各指标标注为准，变动幅度为同比</span>
    </footer>
  </div>
  <script src="/static/executive-dashboard-demo.js?v=24"></script>
</body>
</html>
