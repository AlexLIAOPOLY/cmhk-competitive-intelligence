name: CI

on:
  push:
    branches:
      - codex-render-python-deploy
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Chinese font runtime
        run: sudo apt-get update && sudo apt-get install --yes fonts-noto-cjk fonts-wqy-zenhei
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run isolated full regression and hygiene gates
        run: make ci
